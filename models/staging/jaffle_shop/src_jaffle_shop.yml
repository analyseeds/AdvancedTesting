version: 2

sources:
    - name: jaffle_shop
      description: A clone of a Postgres application database.
      database: dbtdevelopment
      schema: jaffle_shop
      tables:
        - name: customers
          description: Raw customers data.
          columns:
            - name: ID
              description: es la clave primaria
              tests:
                - unique
                - not_null
            - name: FIRST_NAME
              description: es el nombre del cliente
            - name: LAST_NAME
              description: es el apellido del cliente

        - name: orders
          description: Raw orders data.
          columns:
            - name: ID
              description: es la clave primaria
              tests:
                - unique
                - not_null
            - name: USER_ID
              description: es la clave foranea de la tabla de clientes
            - name: ORDER_DATE
              description: es la fecha en la que se realizó la orden
            - name: STATUS
              description: es el estado de la orden
              