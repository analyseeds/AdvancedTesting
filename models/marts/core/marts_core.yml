version: 2

models:
  - name: dim_customers
    description: un cliente por registro
    columns:
      - name: customer_id
        description: es la clave primaria
        tests:
          - unique
          - not_null
          - dbt_utils.cardinality_equality:
              field: customer_id
              to: ref('stg_customers')
      - name: full_name
        description: es el nombre y apellidos del cliente
      - name: first_order_date
        description: es la fecha de la primera orden, puede ser NULL si ese cliente aún no ordenó
      - name: most_recent_order_date
        description: es la fecha de la última orden, puede ser NULL si ese cliente aún no ordenó
      - name: number_of_orders
        description: es el número de órdenes que tiene ese cliente
      - name: lifetime_value
        description: es el monto total de todos los pagos de todas las órdenes de ese cliente
  - name: fct_orders
    description: una orden por registro
    columns:
      - name: order_id
        description: es la clave primaria
        tests:
          - unique
          - not_null
          - dbt_utils.cardinality_equality:
              field: order_id
              to: ref('stg_orders')
      - name: customer_id
        description: es la clave foránea de la tabla de clientes
        tests:
          - relationships:
              field: customer_id
              to: ref('dim_customers')
      - name: order_date
        description: es la fecha en la que se realizó la orden
      - name: amount
        description: es el monto total de los pagos
        tests:
          - dollars_spent_greater_than_one:
              group_column: customer_id
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "amount is not null"
              strictly: false
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "order_id is not null"
              strictly: false # esto es como añadir un "o igual" al intervalo
          - dbt_expectations.expect_column_mean_to_be_between:
              min_value: 1
              group_by: [customer_id]
              row_condition: "order_id is not null"
              strictly: false # esto es como añadir un "o igual" al intervalo